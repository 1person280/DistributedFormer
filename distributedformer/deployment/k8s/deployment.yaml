apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributedformer-pulse
  labels:
    app: distributedformer
    component: pulse-network
spec:
  replicas: 2
  selector:
    matchLabels:
      app: distributedformer
      component: pulse-network
  template:
    metadata:
      labels:
        app: distributedformer
        component: pulse-network
    spec:
      containers:
        - name: pulse-network
          image: distributedformer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: "df-redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: DF_DEPTH
              value: "2"
            - name: KV_CAPACITY
              value: "100000"
            - name: TENANT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributedformer-redis
  labels:
    app: distributedformer
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributedformer
      component: redis
  template:
    metadata:
      labels:
        app: distributedformer
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
