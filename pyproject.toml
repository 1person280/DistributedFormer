[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributedformer"
version = "0.2.0"
description = "Event-driven spiking neural network agent framework with fractal recursion and KV-stack memory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DistributedFormer contributors" }]
keywords = ["spiking-neural-network", "neuromorphic", "agents", "event-driven", "anomaly-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
realtime = ["yfinance>=0.2"]
redis = ["redis>=5.0"]
viz = ["matplotlib>=3.7", "prometheus-client>=0.19"]
dev = ["pytest>=7.0", "yfinance>=0.2"]

[project.scripts]
dformer = "distributedformer.cli:main"

[project.urls]
Homepage = "https://github.com/1person280/DistributedFormer"
Documentation = "https://github.com/1person280/DistributedFormer#readme"

[tool.setuptools.packages.find]
include = ["distributedformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
