[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributedformer"
version = "0.9.1"
description = "CubeGPT — cube-connected multimodal spiking pulse model (4 faces x ~4.4K units x 16 params ~ 281K), with KV-stack memory and multi-agent pulse workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DistributedFormer contributors" }]
keywords = ["spiking-neural-network", "neuromorphic", "agents", "event-driven", "anomaly-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
realtime = ["yfinance>=0.2"]
redis = ["redis>=5.0"]
viz = ["matplotlib>=3.7", "prometheus-client>=0.19"]
dev = ["pytest>=7.0", "yfinance>=0.2"]

[project.scripts]
dformer = "src.cli:main"
migrate-v1-to-v2 = "src.cutemamen.migrate:main"

[project.urls]
Homepage = "https://github.com/1person280/DistributedFormer"
Documentation = "https://github.com/1person280/DistributedFormer#readme"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["src.tests*", "src.experiments*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
cache_dir = "cache/pytest"
