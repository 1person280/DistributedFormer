version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: df-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  pulse-network-1:
    build:
      context: ..
      dockerfile: src/deployment/Dockerfile
    container_name: df-pulse-1
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - KV_BACKEND=redis
      - DF_DEPTH=2
      - DF_DIM=16
      - KV_CAPACITY=100000
      - TENANT_ID=shared_tenant
      - PYTHONUNBUFFERED=1
    volumes:
      - ../reports:/app/reports
      - ../logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  pulse-network-2:
    build:
      context: ..
      dockerfile: src/deployment/Dockerfile
    container_name: df-pulse-2
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - KV_BACKEND=redis
      - DF_DEPTH=2
      - DF_DIM=16
      - KV_CAPACITY=100000
      - TENANT_ID=shared_tenant
      - PYTHONUNBUFFERED=1
    volumes:
      - ../reports:/app/reports
      - ../logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 可选: Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: df-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
